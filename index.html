<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal - Access Granted</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0f12;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .terminal-window {
            width: 100%;
            max-width: 800px;
            background: #11141a;
            border-radius: 6px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 229, 255, 0.1);
            border: 1px solid #222831;
            overflow: hidden;
        }
        .terminal-header {
            background: #1a1f29;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222831;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .buttons {
            display: flex;
            gap: 8px;
        }
        .button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .button.red { background: #ff5f56; }
        .button.yellow { background: #ffbd2e; }
        .button.green { background: #27c93f; }
        .title {
            color: #a5adbb;
            margin-left: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .music-btn {
            background: #222831;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: monospace;
            border-radius: 3px;
            animation: pulse 1.5s infinite;
        }
        .terminal-body {
            padding: 25px;
            min-height: 450px;
        }
        .line {
            margin-bottom: 10px;
            white-space: pre-wrap;
            opacity: 0;
            display: none;
        }
        .line.visible {
            display: block;
            animation: fadeIn 0.1s forwards;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #00e5ff;
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-left: 4px;
        }
        .text-white { color: #ffffff; }
        .text-blue { color: #4fc3f7; }
        .text-heart { color: #ff4081; }
        
        .code-block {
            background: #090b0e;
            padding: 15px;
            border-left: 3px solid #00e5ff;
            margin: 15px 0;
            color: #a5adbb;
            border-radius: 0 4px 4px 0;
        }

        .emoji-heart-line {
            font-size: 48px;
            margin: 15px 0;
            text-align: left;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="terminal-window">
    <div class="terminal-header">
        <div class="header-left">
            <div class="buttons">
                <div class="button red"></div>
                <div class="button yellow"></div>
                <div class="button green"></div>
            </div>
            <div class="title">neki@marian-heart: ~</div>
        </div>
        <button class="music-btn" id="musicToggle">🔊 [MUSIC: OFF]</button>
    </div>
    <div class="terminal-body" id="terminal"></div>
</div>

<audio id="bgm" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>
    const linesData = [
        { text: "$ ./initialize_heartbeat.sh", type: "command" },
        { text: "Initializing...", type: "info", delay: 800 },
        { text: "[✓] Loading Instagram Jetpack Cat messages...", type: "success" },
        { text: "[✓] Loading first "hello"\...", type: "success" },
        { text: "[✓] Loading Discord voice calls...", type: "success" },
        { text: "[✓] Executing command: /cast Nanoboost -> Zenyatta (x2)...", type: "success", class: "text-white", delay: 400 },
        { text: "[✓] Loading sleepless nights together...", type: "success" },
        { text: "[✓] Loading anime marathon history...", type: "success" },
        { text: "[✓] Loading butterflies in stomach...", type: "success" },
        { text: "[✓] Loading sparkling eyes effect...", type: "success" },
        { text: "[✓] Loading first kiss memory...", type: "success" },
        { text: "[✓] Loading shared laughs and warm hugs...", type: "success" },
        { text: "[✓] Loading effective communication protocol and trust...", type: "success" },
        { text: "[✓] Loading mutual support and chemistry core...", type: "success" },
        { text: "[✓] Loading attraction, desire, and affection modules...", type: "success" },
        { text: "[✓] Loading shared feelings and future dreams...", type: "success" },
        { text: "[✓] Loading that infamous "cobra" at the photo booth...", type: "success", delay: 600 },
        { text: "Decrypting heart...", type: "info" },
        { text: "████████████████████ 100%", type: "progress", delay: 1000 },
        { text: "Authenticating...", type: "info", delay: 500 },
        { text: "Access granted.", type: "success", class: "text-blue", delay: 800 },
        { text: "$ cat /etc/heart.conf", type: "command", delay: 600 },
        { text: `owner=Marian
partner=Neki
trust=100%
communication=100%
love=∞`, type: "code" },
        { text: `while(alive){
    ILoveYou("Neki ❤️");
}`, type: "code", delay: 800 },
        { text: "Relationship.exe running...", type: "heart", class: "text-heart" },
        { text: "❤️‍🩹", type: "emoji-heart", class: "emoji-heart-line" }
    ];

    const terminal = document.getElementById('terminal');
    const bgm = document.getElementById('bgm');
    const musicToggle = document.getElementById('musicToggle');

    musicToggle.addEventListener('click', () => {
        if (bgm.paused) {
            bgm.play().catch(e => console.log("Audio play blocked", e));
            musicToggle.innerText = "🔊 [MUSIC: ON]";
            musicToggle.style.animation = "none";
        } else {
            bgm.pause();
            musicToggle.innerText = "🔇 [MUSIC: OFF]";
        }
    });

    function createCursor() {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        return cursor;
    }

    async function typeLine(lineObj) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line visible ' + (lineObj.class || '');
        
        if (lineObj.type === 'code') {
            lineDiv.className += ' code-block';
        }
        
        terminal.appendChild(lineDiv);
        const cursor = createCursor();
        lineDiv.appendChild(cursor);

        if (lineObj.type === 'command') {
            let text = lineObj.text;
            for (let i = 0; i < text.length; i++) {
                cursor.before(text[i]);
                await new Promise(res => setTimeout(res, 50));
            }
        } else {
            let text = lineObj.text;
            if (lineObj.type === 'code') {
                lineDiv.innerHTML = text.replace(/
/g, '<br>').replace(/ /g, '&nbsp;');
                lineDiv.appendChild(cursor);
            } else {
                cursor.before(text);
            }
        }

        await new Promise(res => setTimeout(res, lineObj.delay || 150));
        cursor.remove();
    }

    async function startTerminal() {
        for (const line of linesData) {
            await typeLine(line);
        }
        const finalLine = document.createElement('div');
        finalLine.className = 'line visible';
        finalLine.innerHTML = '$ ';
        finalLine.appendChild(createCursor());
        terminal.appendChild(finalLine);
    }

    window.onload = startTerminal;
</script>

</body>
</html>
